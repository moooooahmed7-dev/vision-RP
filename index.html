<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision RP - تقديم السيرفر</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
            cursor: default;
        }

        /* تصميم الماوس التفاعلي */
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid #e11d48;
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
            transition: transform 0.1s ease;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        /* لوحة التحميل مع تأثير الكتابة والصوت */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #09090b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: #e11d48;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease;
        }

        #typewriterText {
            border-left: 3px solid #e11d48;
            padding-left: 5px;
            white-space: pre-wrap;
            line-height: 1.6;
            max-width: 800px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            color: #e11d48;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #musicBtn {
            background: #27272a;
            color: #fff;
            border: 1px solid #3f3f46;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }

        #musicBtn:hover {
            border-color: #e11d48;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #a1a1aa;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            background-color: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #e11d48;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #27272a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #d4d4d8;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: #e11d48;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #e11d48;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background-color: #be123c;
        }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div id="typewriterText"></div>
    </div>

    <div class="cursor" id="customCursor"></div>

    <div class="container">
        <div class="header-section">
            <h1>VISION RP</h1>
            <button onclick="toggleMusic()" id="musicBtn">🔇 تشغيل الموسيقى</button>
        </div>
        
        <form id="applyForm">
            <div class="form-row">
                <div class="form-group">
                    <label>الاسم الحقيقي</label>
                    <input type="text" placeholder="اكتب اسمك الحقيقي" required>
                </div>
                <div class="form-group">
                    <label>العمر</label>
                    <input type="number" placeholder="العمر" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>هل لعبت رول بلاي من قبل؟</label>
                    <select required>
                        <option value="" disabled selected>اختر إجابة</option>
                        <option value="yes">نعم</option>
                        <option value="no">لا</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>عدد ساعات FiveM</label>
                    <input type="number" placeholder="عدد ساعات FiveM" required>
                </div>
            </div>

            <div class="form-group">
                <label>اسم الشخصية داخل اللعبة</label>
                <input type="text" placeholder="اسم الشخصية بالكامل" required>
            </div>

            <div class="form-group">
                <label>قصة الشخصية</label>
                <textarea placeholder="اكتب نبذة مختصرة عن قصة شخصيتك..." required></textarea>
            </div>

            <div class="form-group">
                <label>لماذا تريد الانضمام إلينا؟</label>
                <textarea placeholder="لماذا تريد الانضمام إلى سيرفر Vision RP؟" required></textarea>
            </div>

            <div class="form-group">
                <label>Discord Tag</label>
                <input type="text" placeholder="مثال: username#0000 أو username" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms" style="margin:0; color:#fff;">لقد قرأت قوانين السيرفر بالكامل، وأتعهد بالالتزام بها وبقرارات الإدارة.</label>
            </div>

            <button type="submit" class="btn-submit">إرسال الطلب</button>
        </form>
    </div>

    <audio id="bgMusic" loop>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        // صوت التكتكة أثناء الكتابة
        function playClickSound() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        // النصوص المكتوبة بالترتيب
        const textToType = "مرحباً بكم...\nتم صنع هذا الموقع بصفة [ ريكو ]\n\nأهلاً بك في عالم فليكس سيتي\nسيرفر Vision RP - السيرفر القوي العربي 🔥";
        let charIndex = 0;
        const speed = 50; 
        const targetElement = document.getElementById("typewriterText");

        function typeWriter() {
            if (charIndex < textToType.length) {
                let currentChar = textToType.charAt(charIndex);
                targetElement.innerHTML += currentChar;
                
                if (currentChar !== ' ' && currentChar !== '\n') {
                    playClickSound();
                }

                charIndex++;
                setTimeout(typeWriter, speed);
            } else {
                setTimeout(function() {
                    let loader = document.getElementById('loadingScreen');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 800);
                }, 2000);
            }
        }

        window.addEventListener('load', function() {
            setTimeout(typeWriter, 500);
        });

        // حركة مؤشر الماوس
        const cursor = document.getElementById('customCursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // زر تشغيل/إيقاف الموسيقى
        function toggleMusic() {
            var audio = document.getElementById("bgMusic");
            var btn = document.getElementById("musicBtn");
            if (audio.paused) {
                audio.play();
                btn.innerText = "🔊 إيقاف الموسيقى";
            } else {
                audio.pause();
                btn.innerText = "🔇 تشغيل الموسيقى";
            }
        }

        document.getElementById('applyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم إرسال طلبك بنجاح إلى سيرفر Vision RP!');
        });
    </script>

</body>
</html>
