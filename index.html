<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision RP - تقديم السيرفر</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        /* شاشة التحميل الفاجرة مع تأثير الكتابة والصوت */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050507;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: #e11d48;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease;
        }

        #typewriterText {
            border-left: 4px solid #e11d48;
            padding-left: 8px;
            white-space: pre-wrap;
            line-height: 1.8;
            max-width: 850px;
            text-shadow: 0 0 15px rgba(225, 29, 72, 0.4);
        }

        .container {
            width: 100%;
            max-width: 680px;
            background-color: #141417;
            border: 1px solid #27272a;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #27272a;
            padding-bottom: 15px;
        }

        h1 {
            color: #e11d48;
            font-size: 26px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .server-badge {
            background-color: rgba(225, 29, 72, 0.1);
            color: #e11d48;
            border: 1px solid rgba(225, 29, 72, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #a1a1aa;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            background-color: #1f1f23;
            border: 1px solid #27272a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #e11d48;
            box-shadow: 0 0 10px rgba(225, 29, 72, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #1f1f23;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #d4d4d8;
            border: 1px solid #27272a;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: #e11d48;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #be123c, #9f1239);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div id="typewriterText"></div>
    </div>

    <div class="container">
        <div class="header-section">
            <h1>VISION RP</h1>
            <div class="server-badge">FLEX CITY 🔥</div>
        </div>
        
        <form id="applyForm">
            <div class="form-row">
                <div class="form-group">
                    <label>الاسم الحقيقي</label>
                    <input type="text" placeholder="اكتب اسمك الحقيقي" required>
                </div>
                <div class="form-group">
                    <label>العمر</label>
                    <input type="number" placeholder="العمر" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>هل لعبت رول بلاي من قبل؟</label>
                    <select required>
                        <option value="" disabled selected>اختر إجابة</option>
                        <option value="yes">نعم</option>
                        <option value="no">لا</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>عدد ساعات فليكس سيتي من يومك</label>
                    <input type="number" placeholder="عدد الساعات" required>
                </div>
            </div>

            <div class="form-group">
                <label>اسم الشخصية داخل اللعبة</label>
                <input type="text" placeholder="اسم الشخصية بالكامل" required>
            </div>

            <div class="form-group">
                <label>قصة الشخصية</label>
                <textarea placeholder="اكتب نبذة مختصرة عن قصة شخصيتك..." required></textarea>
            </div>

            <div class="form-group">
                <label>لماذا تريد الانضمام إلينا؟</label>
                <textarea placeholder="لماذا تريد الانضمام إلى سيرفر Vision RP؟" required></textarea>
            </div>

            <div class="form-group">
                <label>Discord Tag</label>
                <input type="text" placeholder="مثال: username#0000 أو username" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms" style="margin:0; color:#fff; cursor:pointer;">لقد قرأت قوانين السيرفر بالكامل، وأتعهد بالالتزام بها وبقرارات الإدارة.</label>
            </div>

            <button type="submit" class="btn-submit">إرسال الطلب</button>
        </form>
    </div>

    <script>
        // مولد صوت التكتكة برمجياً (بيشتغل تلقائي مع كل حرف بيتكتب)
        function playClickSound() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        }

        // الكلام اللي هيتكتب بالتكتكة
        const textToType = "مرحباً بكم...\nتم صنع هذا الموقع بصفة [ ريكو ]\n\nأهلاً بك في عالم فليكس سيتي\nسيرفر Vision RP - السيرفر القوي العربي 🔥";
        let charIndex = 0;
        const speed = 45; 
        const targetElement = document.getElementById("typewriterText");

        function typeWriter() {
            if (charIndex < textToType.length) {
                let currentChar = textToType.charAt(charIndex);
                targetElement.innerHTML += currentChar;
                
                // تشغيل صوت التكتكة مع الحروف الفعالة
                if (currentChar !== ' ' && currentChar !== '\n') {
                    playClickSound();
                }

                charIndex++;
                setTimeout(typeWriter, speed);
            } else {
                // بعد ما يخلص كتابة، يستنى ثانيتين ويخفي شاشة التحميل بانيميشن فخم
                setTimeout(function() {
                    let loader = document.getElementById('loadingScreen');
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 800);
                }, 2000);
            }
        }

        // بدء شاشة التحميل أول ما الموقع يفتح
        window.addEventListener('load', function() {
            setTimeout(typeWriter, 500);
        });

        // رسالة نجاح الإرسال
        document.getElementById('applyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('تم إرسال طلبك بنجاح إلى سيرفر Vision RP!');
        });
    </script>

</body>
</html>
