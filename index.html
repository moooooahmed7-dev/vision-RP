<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISION RP | FLEX CITY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff003c;
            --secondary: #00f2ff;
            --bg: #050505;
            --card-bg: rgba(10, 10, 10, 0.95);
        }

        /* تصفير الإعدادات وضمان التوسط */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Tajawal', sans-serif; 
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background: var(--bg);
            background-image: 
                linear-gradient(rgba(255, 0, 60, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 60, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #fff;
            
            /* أهم جزء للتوسط */
            display: flex;
            justify-content: center; /* توسيط أفقي */
            align-items: center;     /* توسيط عمودي */
            padding: 20px;           /* مسافة أمان للجوال */
        }

        /* شاشة البداية */
        #startOverlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .start-btn {
            padding: 20px 40px;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-family: 'Orbitron';
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: transparent;
            box-shadow: 0 0 20px var(--primary);
            animation: pulse 1.5s infinite;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* الحاوية الرئيسية - معدلة للتوسط */
        .container {
            width: 100%;
            max-width: 650px; 
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 35px;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none; 
            margin: auto; 
        }

        /* إطار النيون */
        .container::after {
            content: "";
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, var(--primary), transparent, var(--secondary), transparent);
            background-size: 400%;
            z-index: -1;
            border-radius: 22px;
            animation: move-border 10s linear infinite;
        }

        @keyframes move-border {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 {
            font-family: 'Orbitron';
            font-size: clamp(24px, 7vw, 45px); 
            background: linear-gradient(to bottom, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
        }

        .dev-badge {
            margin-top: 5px;
            font-size: 11px;
            color: #888;
            letter-spacing: 2px;
        }
        .dev-badge span { color: var(--primary); }

        /* الاستمارة */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }

        .form-group { margin-bottom: 15px; text-align: right; }
        label { color: var(--primary); font-size: 12px; font-weight: 800; display: block; margin-bottom: 8px; }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        input:focus { border-color: var(--secondary); }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-submit:hover { filter: brightness(1.2); transform: translateY(-2px); }

        .scanner {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--primary);
            top: 0; left: 0;
            box-shadow: 0 0 15px var(--primary);
            animation: scan 4s linear infinite;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body>

    <div id="startOverlay">
        <button class="start-btn" onclick="startSystem()">دخول النظام</button>
        <p style="margin-top: 15px; color: #444; font-size: 10px; font-family: 'Orbitron';">CORE INITIALIZATION</p>
    </div>

    <div class="container" id="mainContainer">
        <div class="scanner"></div>
        <div class="header">
            <h1>VISION RP</h1>
            <div class="dev-badge">BY: <span>RICO</span> & <span>ABDULLAH</span></div>
        </div>
        
        <form id="applyForm">
            <div class="form-row">
                <div class="form-group">
                    <label>الاسم الحقيقي</label>
                    <input type="text" id="realName" required>
                </div>
                <div class="form-group">
                    <label>العمر</label>
                    <input type="number" id="age" required>
                </div>
            </div>

            <div class="form-group">
                <label>اسم الشخصية</label>
                <input type="text" id="charName" placeholder="Rico_Abdullah" required>
            </div>

            <div class="form-group">
                <label>قصة الشخصية</label>
                <textarea id="story" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label>معرف الديسكورد</label>
                <input type="text" id="discord" placeholder="Username" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">إرسال البيانات</button>
        </form>
    </div>

    <script>
        // ضع رابط الويب هوك الخاص بك هنا
        const WEBHOOK_URL = "ضع_رابط_الويب_هوك_هنا";

        function robotSpeak() {
            if ('speechSynthesis' in window) {
                const speech = new SpeechSynthesisUtterance();
                speech.text = "يرجى دخول البيانات... أهلاً بك في عالم فليكس سيتي.. المطور ريكو والمطور عبد الله";
                speech.lang = 'ar-SA';
                speech.rate = 0.9;
                window.speechSynthesis.speak(speech);
            }
        }

        function startSystem() {
            document.getElementById('startOverlay').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            robotSpeak();
        }

        document.getElementById('applyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            
            const data = {
                embeds: [{
                    title: "📥 طلب انضمام جديد",
                    color: 16711740,
                    fields: [
                        { name: "👤 الاسم", value: document.getElementById('realName').value, inline: true },
                        { name: "🔞 العمر", value: document.getElementById('age').value, inline: true },
                        { name: "🎭 الشخصية", value: document.getElementById('charName').value, inline: true },
                        { name: "🆔 ديسكورد", value: document.getElementById('discord').value, inline: true },
                        { name: "📜 القصة", value: document.getElementById('story').value }
                    ],
                    footer: { text: "VISION RP System" }
                }]
            };

            if (WEBHOOK_URL === "ضع_رابط_الويب_هوك_هنا") {
                alert("يرجى وضع رابط الويب هوك أولاً");
                return;
            }

            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                alert('✅ تم الإرسال بنجاح!');
                location.reload();
            } catch (error) {
                alert('❌ فشل الإرسال');
                btn.disabled = false;
                btn.innerText = "إرسال البيانات";
            }
        });
    </script>
</body>
</html>
