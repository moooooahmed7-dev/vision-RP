<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VISION RP | FLEX CITY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff003c;
            --secondary: #00f2ff;
            --bg: #050505;
            --card-bg: #0a0a0a;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Tajawal', sans-serif; 
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg);
            color: #fff;
        }

        body {
            background-image: 
                linear-gradient(rgba(255, 0, 60, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 60, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        /* شاشة دخول النظام */
        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .start-btn {
            padding: 18px 36px;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.6);
            animation: pulse 1.5s infinite;
            cursor: pointer;
            border-radius: 8px;
            outline: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 0, 60, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 0, 60, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 0, 60, 0.5); }
        }

        .start-subtext {
            margin-top: 15px;
            color: #666;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }

        /* الحاوية الرئيسية */
        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px 20px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            border: 1px solid rgba(255, 0, 60, 0.3);
            display: none; /* تظهر عند ضغط زر الدخول */
            margin: auto;
        }

        .header { 
            text-align: center; 
            margin-bottom: 25px; 
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: #ffffff;
            text-shadow: 0 0 10px var(--primary);
            letter-spacing: 2px;
        }

        .dev-badge {
            margin-top: 6px;
            font-size: 12px;
            color: #aaa;
            letter-spacing: 1px;
        }
        .dev-badge span { 
            color: var(--primary); 
            font-weight: bold;
        }

        /* الاستمارة */
        .form-row { 
            display: flex; 
            flex-direction: column;
            gap: 12px; 
            margin-bottom: 12px;
        }

        @media (min-width: 480px) {
            .form-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }

        .form-group { 
            margin-bottom: 14px; 
            text-align: right; 
        }

        label { 
            color: var(--primary); 
            font-size: 13px; 
            font-weight: 800; 
            display: block; 
            margin-bottom: 6px; 
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus { 
            border-color: var(--secondary); 
            box-shadow: 0 0 8px rgba(0, 242, 255, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), #b3002a);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', 'Tajawal', sans-serif;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 0, 60, 0.4);
            transition: transform 0.2s, background 0.3s;
        }

        .btn-submit:active { 
            transform: scale(0.98); 
        }

        /* خط مسح نيون زيني */
        .scanner {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--primary);
            top: 0; left: 0;
            box-shadow: 0 0 10px var(--primary);
            animation: scan 4s linear infinite;
            border-radius: 16px 16px 0 0;
        }
        @keyframes scan { 
            0% { top: 0; opacity: 0; } 
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; } 
        }
    </style>
</head>
<body>

    <div id="startOverlay">
        <button class="start-btn" id="startBtn">دخول النظام</button>
        <p class="start-subtext">CLICK TO INITIALIZE VISION AI</p>
    </div>

    <div class="container" id="mainContainer">
        <div class="scanner"></div>
        <div class="header">
            <h1>VISION RP</h1>
            <div class="dev-badge">BY: <span>RICO</span> & <span>ABDULLAH</span></div>
        </div>
        
        <form id="applyForm">
            <div class="form-row">
                <div class="form-group">
                    <label>الاسم الحقيقي</label>
                    <input type="text" id="realName" placeholder="اكتب اسمك الحقيقي" required>
                </div>
                <div class="form-group">
                    <label>العمر</label>
                    <input type="number" id="age" placeholder="العمر" required>
                </div>
            </div>

            <div class="form-group">
                <label>اسم الشخصية داخل اللعبة</label>
                <input type="text" id="charName" placeholder="مثال: Rico_Abdullah" required>
            </div>

            <div class="form-group">
                <label>قصة الشخصية</label>
                <textarea id="story" placeholder="اكتب قصة مختصرة لشخصيتك..." required></textarea>
            </div>

            <div class="form-group">
                <label>معرف الديسكورد (Discord Tag)</label>
                <input type="text" id="discord" placeholder="Username" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">إرسال البيانات</button>
        </form>
    </div>

    <script>
        // ضع رابط الويب هوك الخاص بك هنا
        const WEBHOOK_URL = "ضع_رابط_الويب_هوك_هنا";

        function robotSpeak() {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const speech = new SpeechSynthesisUtterance();
                    speech.text = "يرجى دخول البيانات... أهلاً بك في عالم فليكس سيتي.. المطور ريكو والمطور عبد الله";
                    speech.lang = 'ar-SA';
                    speech.rate = 0.9;
                    window.speechSynthesis.speak(speech);
                }
            } catch(e) {
                console.log("Speech synthesis unsupported or blocked");
            }
        }

        function startSystem() {
            try {
                const overlay = document.getElementById('startOverlay');
                const container = document.getElementById('mainContainer');
                
                if (overlay) overlay.style.display = 'none';
                if (container) container.style.display = 'block';

                robotSpeak();
            } catch(e) {
                document.getElementById('startOverlay').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
            }
        }

        const overlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');

        if (overlay) {
            overlay.addEventListener('click', startSystem);
            overlay.addEventListener('touchstart', startSystem, {passive: true});
        }
        if (startBtn) {
            startBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                startSystem();
            });
        }

        document.getElementById('applyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            
            const data = {
                embeds: [{
                    title: "📥 طلب انضمام جديد - VISION RP",
                    color: 16711740,
                    fields: [
                        { name: "👤 الاسم", value: document.getElementById('realName').value || "غير محدد", inline: true },
                        { name: "🔞 العمر", value: document.getElementById('age').value || "غير محدد", inline: true },
                        { name: "🎭 الشخصية", value: document.getElementById('charName').value || "غير محدد", inline: true },
                        { name: "🆔 ديسكورد", value: document.getElementById('discord').value || "غير محدد", inline: true },
                        { name: "📜 القصة", value: document.getElementById('story').value || "غير محدد" }
                    ],
                    footer: { text: "VISION RP System | By Rico & Abdullah" }
                }]
            };

            if (WEBHOOK_URL === "ضع_رابط_الويب_هوك_هنا" || !WEBHOOK_URL) {
                alert("يرجى وضع رابط الويب هوك في الكود أولاً!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok || response.status === 204) {
                    alert('✅ تم إرسال طلبك بنجاح إلى السيرفر!');
                    location.reload();
                } else {
                    throw new Error('Server responded with error');
                }
            } catch (error) {
                alert('❌ حدث خطأ أثناء الإرسال، يرجى التأكد من رابط الويب هوك.');
                btn.disabled = false;
                btn.innerText = "إرسال البيانات";
            }
        });
    </script>
</body>
</html>
